name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (type-check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=backend --include=dev
      - run: npx prisma generate
        working-directory: apps/backend
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/backend
      - run: npm test
        working-directory: apps/backend
        env:
          NODE_ENV: test
      - run: npx nest build
        working-directory: apps/backend

  web:
    name: Web (type-check and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=web --include=dev
      - run: npm run build --workspace=web

  contracts:
    name: Smart contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx hardhat test
        env:
          USE_LOCAL_SOLC: "false"

  mobile:
    name: Mobile (type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace=mobile --include=dev
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/mobile
